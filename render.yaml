services:
  - type: web
    name: gameshow-together
    env: node
    plan: free
    region: singapore # Gần Việt Nam, độ trễ cực thấp
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    healthCheckPath: /api/health
